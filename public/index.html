<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>LUVIA — Celestial Love Companion</title>
    
    <!-- 1. 强制注入 Tailwind CSS 引擎（解决样式丢失） -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              celestial: '#0B0914',
              gold: '#D4AF37',
            }
          }
        }
      }
    </script>

    <!-- 2. 引入 LUVIA 高定字体 (Cinzel + Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- 3. 全局高级质感与 Glassmorphism 样式 -->
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #0B0914;
        color: #E2D9F3;
      }
      h1, h2, h3, .font-serif-luxury {
        font-family: 'Cinzel', serif;
      }
      /* 天体夜空渐变背景 */
      .bg-celestial-gradient {
        background: radial-gradient(circle at 50% 0%, #1A102F 0%, #0B0914 70%, #05040A 100%);
      }
      /* 玻璃拟态卡片 */
      .glass-card {
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(212, 175, 55, 0.18);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      }
      /* 香槟金渐变文字 */
      .text-gold-gradient {
        background: linear-gradient(135deg, #FFF6D6 0%, #D4AF37 50%, #AA7C11 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body class="bg-celestial-gradient text-[#E2D9F3] antialiased overflow-x-hidden selection:bg-[#D4AF37]/30 min-h-screen">
    <div id="root"></div>
  </body>
</html>
