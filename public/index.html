<!DOCTYPE html>
<html lang="vi" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>LUVIA — Celestial Love Companion</title>

    <!-- Tailwind Engine -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              celestial: {
                bg: '#080511',
                card: 'rgba(255, 255, 255, 0.03)',
                gold: '#D4AF37',
                'gold-light': '#FFF3C4',
                plum: '#1A0E2E',
              }
            },
            fontFamily: {
              serif: ['Cinzel', 'serif'],
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Celestial Core CSS -->
    <style>
      body {
        background-color: #080511;
        color: #E6E1F3;
        font-family: 'Plus Jakarta Sans', sans-serif;
        overflow-x: hidden;
      }
      .font-serif-luxury {
        font-family: 'Cinzel', serif;
      }
      .gold-gradient-text {
        background: linear-gradient(135deg, #FFF8DC 0%, #D4AF37 50%, #997312 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .gold-border-glow {
        border: 1px solid rgba(212, 175, 55, 0.25);
        box-shadow: 0 0 20px rgba(212, 175, 55, 0.08);
      }
      .glass-panel {
        background: rgba(22, 14, 38, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(212, 175, 55, 0.2);
      }
    </style>
  </head>
  <body class="bg-[#080511] antialiased selection:bg-[#D4AF37]/30">
    <div id="root"></div>
  </body>
</html>
